<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="100%" height="100%">
  <!-- Five-Color Rice Petals Icon -->
  <g transform="translate(10, 10) scale(0.8)">
    <!-- Red (Gấc) -->
    <path d="M 50 15 C 60 30, 65 45, 50 60 C 35 45, 40 30, 50 15 Z" fill="#D5433A" />
    <!-- Yellow (Dành dành/Nghệ) -->
    <path d="M 85 50 C 70 60, 55 65, 40 50 C 55 35, 70 40, 85 50 Z" fill="#F4B41A" transform="rotate(72 50 50)" />
    <!-- Green (Lá dứa/nếp) -->
    <path d="M 85 50 C 70 60, 55 65, 40 50 C 55 35, 70 40, 85 50 Z" fill="#4B8B3B" transform="rotate(144 50 50)" />
    <!-- Purple (Lá cẩm) -->
    <path d="M 85 50 C 70 60, 55 65, 40 50 C 55 35, 70 40, 85 50 Z" fill="#7D3C98" transform="rotate(216 50 50)" />
    <!-- White (Nếp nương) -->
    <path d="M 85 50 C 70 60, 55 65, 40 50 C 55 35, 70 40, 85 50 Z" fill="#FFFFEC" stroke="#160909" stroke-width="1.5" transform="rotate(288 50 50)" />
    <!-- Center seed -->
    <circle cx="50" cy="50" r="9" fill="#160909" />
    <circle cx="50" cy="50" r="5" fill="#FFFFEC" />
  </g>

  <!-- Typography: XÔI NGŨ SẮC -->
  <text x="115" y="58" font-family="'Fraunces', 'Playfair Display', Georgia, serif" font-size="42" font-weight="800" fill="#FFFFEC" letter-spacing="1">
    XÔI NGŨ SẮC
  </text>
  <!-- Sub-caption -->
  <text x="120" y="82" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="700" fill="#E85646" letter-spacing="3">
    TÂY BẮC • NẾP NƯƠNG THUẦN TỰ NHIÊN
  </text>
</svg>
